<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />

    <title>Nukta — Write and share what you know</title>
    <meta
      name="description"
      content="Nukta is a blogging platform for writing, publishing and sharing posts with rich formatting and images."
    />

    <!-- Link previews. These are static: the app renders client-side, so a
         crawler that does not execute JavaScript sees only what is here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nukta" />
    <meta property="og:title" content="Nukta — Write and share what you know" />
    <meta
      property="og:description"
      content="A blogging platform for writing, publishing and sharing posts with rich formatting and images."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nukta — Write and share what you know" />
    <meta
      name="twitter:description"
      content="A blogging platform for writing, publishing and sharing posts with rich formatting and images."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
